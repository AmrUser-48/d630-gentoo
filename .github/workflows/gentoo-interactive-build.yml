name: Gentoo — Interactive Build Runner
run-name: "Gentoo builder • ${{ inputs.package_set || 'none' }} • ${{ inputs.session_minutes || 240 }} min"

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: SSH session duration after preparation (maximum 300; job timeout 360 minutes)
        required: true
        type: number
        default: 240
      package_set:
        description: Optional package set to build in background while SSH is available
        required: true
        type: choice
        options:
          - none
          - cli
          - development
          - desktop
          - multimedia
          - daily-driver
          - custom
        default: none
      build_set_on_start:
        description: Build the selected package set automatically after SSH is ready
        required: true
        type: boolean
        default: false
      custom_atoms:
        description: For custom set only; space- or comma-separated category/package atoms
        required: false
        type: string
        default: ""
      binpkg_run_id:
        description: Optional numeric run ID of a prior binpkgs release to import before this session
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: gentoo-interactive-build-runner
  cancel-in-progress: true

jobs:
  gentoo-builder:
    name: Gentoo glibc/OpenRC chroot with private SSH
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      GENTOO_ROOT: /opt/gentoo
      PACKAGE_SET: ${{ inputs.package_set || 'none' }}
      BUILD_SET_ON_START: ${{ inputs.build_set_on_start }}
      CUSTOM_ATOMS: ${{ inputs.custom_atoms }}
      BINPKG_RUN_ID: ${{ inputs.binpkg_run_id || '' }}
      SESSION_MINUTES: ${{ inputs.session_minutes || 240 }}

    steps:
      - name: Check out D630 Gentoo configuration
        uses: actions/checkout@v4

      - name: Validate secrets and workflow inputs
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${TAILSCALE_AUTHKEY:-}" ]] || { echo 'Missing repository secret TAILSCALE_AUTHKEY.' >&2; exit 1; }
          [[ -n "${SSH_PUBLIC_KEY:-}" ]] || { echo 'Missing repository secret SSH_PUBLIC_KEY (one-line OpenSSH public key).' >&2; exit 1; }

          session="${SESSION_MINUTES:-240}"
          [[ "$session" =~ ^[0-9]+$ ]] || { echo 'session_minutes must be an integer.' >&2; exit 1; }
          (( session >= 1 && session <= 300 )) || { echo 'session_minutes must be between 1 and 300.' >&2; exit 1; }

          if [[ "$BUILD_SET_ON_START" == 'true' ]]; then
            [[ "$PACKAGE_SET" != 'none' ]] || { echo 'Choose a package_set when build_set_on_start is enabled.' >&2; exit 1; }
            if [[ "$PACKAGE_SET" == 'custom' && -z "${CUSTOM_ATOMS//[ ,]/}" ]]; then
              echo 'For package_set=custom, provide custom_atoms such as "dev-vcs/git net-misc/curl".' >&2
              exit 1
            fi
          fi

          if [[ -n "${BINPKG_RUN_ID:-}" && ! "$BINPKG_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'binpkg_run_id must be the numeric GitHub Actions run ID of a binpkgs release.' >&2
            exit 1
          fi

          key="${SSH_PUBLIC_KEY//$'\r'/}"
          key="${key%$'\n'}"
          [[ "$key" != *$'\n'* ]] || { echo 'SSH_PUBLIC_KEY must contain exactly one key line.' >&2; exit 1; }
          printf '%s\n' "$key" > "$RUNNER_TEMP/ssh_public_key.pub"
          ssh-keygen -lf "$RUNNER_TEMP/ssh_public_key.pub" >/dev/null ||
            { echo 'SSH_PUBLIC_KEY is not a valid OpenSSH public key.' >&2; exit 1; }
          {
            echo "Target CPU: Intel Core 2 / Merom"
            echo "Portage flags: -O2 -pipe -march=core2 -mtune=core2"
            echo "Selected package set: $PACKAGE_SET"
            echo "Build set on start: $BUILD_SET_ON_START"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install host bootstrap and SSH utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl coreutils xz-utils zstd python3 tar rsync openssh-server iptables sudo
          sudo apt-get clean
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enable optional zram swap for memory-heavy Gentoo builds
        shell: bash
        run: |
          set -u
          log="$RUNNER_TEMP/gentoo-builder/zram.log"
          mkdir -p "$(dirname "$log")"
          {
            echo "Before zram:"
            free -h
            echo "Existing swap:"
            swapon --show
          } | tee "$log"

          # Do not consume CPU compressing swap on the standard ~16-GB runner.
          # Only enable zram as a fallback on genuinely small-memory hosts.
          mem_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          if (( mem_kib < 8000000 )); then
            if [[ ! -e /sys/block/zram0 ]]; then
              sudo modprobe zram num_devices=1 >/dev/null 2>&1 ||
                sudo modprobe zram >/dev/null 2>&1 || true
            fi

            if command -v zramctl >/dev/null 2>&1; then
              zdev="$(sudo zramctl --find --size 4G --algorithm lz4 2>/dev/null || true)"
              if [[ "$zdev" == /dev/zram* ]] &&
                 sudo mkswap "$zdev" >/dev/null 2>&1 &&
                 sudo swapon --priority 100 "$zdev" 2>/dev/null; then
                echo "Enabled $zdev as 4 GiB LZ4 zram swap on a low-memory runner." | tee -a "$log"
              else
                echo "zram unavailable; continuing with existing swap." | tee -a "$log"
              fi
            else
              echo "zramctl unavailable; continuing with existing swap." | tee -a "$log"
            fi
          else
            echo "Runner has ${mem_kib} KiB RAM; skipping zram to avoid needless compression overhead." |
              tee -a "$log"
          fi

          {
            echo "After zram:"
            free -h
            swapon --show
          } | tee -a "$log"
          tee -a "$GITHUB_STEP_SUMMARY" < "$log"

      - name: Download and verify official Gentoo amd64 OpenRC Stage 3
        shell: bash
        run: |
          set -euo pipefail
          base='https://distfiles.gentoo.org/releases/amd64/autobuilds/current-stage3-amd64-openrc'
          work="$RUNNER_TEMP/gentoo-stage3"
          report="$RUNNER_TEMP/gentoo-builder"
          mkdir -p "$work" "$report"

          curl -fsSL --retry 3 "$base/latest-stage3-amd64-openrc.txt" -o "$report/stage3-latest.txt"
          line="$(grep -E '^stage3-amd64-openrc-[0-9]{8}T[0-9]{6}Z\.tar\.xz [0-9]+$' "$report/stage3-latest.txt" | head -n 1)"
          [[ -n "$line" ]] || { echo 'Could not parse the official Gentoo latest Stage 3 manifest.' >&2; exit 1; }
          archive="${line%% *}"
          expected_size="${line##* }"
          printf '%s\n' "$archive" > "$report/stage3-archive.txt"

          curl -fL --retry 3 "$base/$archive" -o "$work/$archive"
          actual_size="$(stat -c '%s' "$work/$archive")"
          [[ "$actual_size" == "$expected_size" ]] || {
            echo "Stage 3 size mismatch: expected $expected_size, got $actual_size." >&2
            exit 1
          }

          curl -fsSL --retry 3 "$base/$archive.sha256" -o "$work/$archive.sha256"
          expected_sha="$(grep -Eo '[[:xdigit:]]{64}' "$work/$archive.sha256" | sed -n '1p')"
          [[ "$expected_sha" =~ ^[[:xdigit:]]{64}$ ]] || { echo 'Could not read the Stage 3 SHA-256.' >&2; exit 1; }
          printf '%s  %s\n' "$expected_sha" "$work/$archive" | sha256sum --check -

          sudo install -d -m 0755 "$GENTOO_ROOT"
          sudo tar --extract --file "$work/$archive" --directory "$GENTOO_ROOT" \
            --numeric-owner --xattrs --xattrs-include='*' --preserve-permissions
          printf 'Stage 3 archive: %s\nSHA256: %s\n' "$archive" "$expected_sha" |
            tee "$report/stage3-info.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          sudo readlink "$GENTOO_ROOT/etc/portage/make.profile" |
            tee "$report/stage3-profile.txt" || true
          sudo mkdir -p "$GENTOO_ROOT/var/log/gentoo-bootstrap"
          sudo cp -a "$report/." "$GENTOO_ROOT/var/log/gentoo-bootstrap/" 2>/dev/null || true

      - name: Configure Core 2 Portage and package sets in the Gentoo chroot
        shell: bash
        run: |
          set -euo pipefail
          root="$GENTOO_ROOT"

          sudo mkdir -p "$root/etc/portage" "$root/etc/portage/package-sets" \
            "$root/etc/portage/repos.conf" "$root/etc/portage/profile" "$root/etc/bash/bashrc.d" "$root/etc/env.d" "$root/etc/X11/xorg.conf.d" "$root/usr/local/sbin" "$root/var/cache/binpkgs" \
            "$root/var/log/portage" "$root/dev" "$root/proc" "$root/sys" "$root/run"

          if [[ -f "$root/etc/portage/package.use" ]]; then
            sudo mv "$root/etc/portage/package.use" "$root/etc/portage/package.use.stage3"
          fi
          sudo mkdir -p "$root/etc/portage/package.use"
          sudo install -m 0644 config/portage/make.conf "$root/etc/portage/make.conf"
          # Override Gentoo's profile-forced LLVM targets for this deliberately minimal x86_64 builder.
          sudo install -m 0644 config/portage/profile/package.use.force "$root/etc/portage/profile/package.use.force"
          sudo install -m 0644 config/bash/bashrc.d/10-portage-ask.sh "$root/etc/bash/bashrc.d/10-portage-ask.sh"
          sudo install -m 0644 config/locale.gen "$root/etc/locale.gen"
          sudo install -m 0644 config/env.d/02locale "$root/etc/env.d/02locale"
          sudo install -m 0644 config/xorg/99-synaptics.conf "$root/etc/X11/xorg.conf.d/99-synaptics.conf"
          # Enforce stable-only package selection: do not inherit per-package
          # testing keyword exceptions from the downloaded Stage 3.
          sudo rm -rf "$root/etc/portage/package.accept_keywords" "$root/etc/portage/package.keywords"
          sudo cp -a config/portage/package.use/. "$root/etc/portage/package.use/"
          sudo cp -a config/package-sets/. "$root/etc/portage/package-sets/"
          sudo install -m 0755 scripts/gentoo-build-set "$root/usr/local/sbin/gentoo-build-set"

          if [[ ! -f "$root/etc/portage/repos.conf/gentoo.conf" ]]; then
            sudo tee "$root/etc/portage/repos.conf/gentoo.conf" >/dev/null <<'EOF'
          [gentoo]
          location = /var/db/repos/gentoo
          sync-type = rsync
          sync-uri = rsync://rsync.gentoo.org/gentoo-portage
          auto-sync = yes
          EOF
          fi

          # The chroot shares the host network namespace; copy resolver contents
          # rather than a possibly broken systemd-resolved stub symlink.
          sudo rm -f "$root/etc/resolv.conf"
          sudo cp -L /etc/resolv.conf "$root/etc/resolv.conf"

          for mountpoint in dev proc sys run; do
            sudo mount --rbind "/$mountpoint" "$root/$mountpoint"
            sudo mount --make-rslave "$root/$mountpoint"
          done

          {
            echo '## Portage configuration installed'
            echo '- Compiler: -O2 -pipe -march=core2 -mtune=core2'
            echo '- ACCEPT_KEYWORDS=amd64: stable amd64 ebuilds only; no inherited package.accept_keywords testing exceptions.'
            echo '- CPU_FLAGS_X86: MMX, SSE, SSE2, SSE3, SSSE3 only (Core 2 T7250; not copied from the CI CPU).'
            echo '- OpenRC profile inherited from official Gentoo Stage 3.'
            echo '- FEATURES=parallel-fetch buildpkg; binary packages stored in /var/cache/binpkgs.'
            echo '- LLVM backends reduced to X86 and SPIRV by a deliberate local package.use.force override.'
            echo '- Gentoo Stage 3 is used as a chroot build environment; the Ubuntu host kernel is shared.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tune compile parallelism to runner resources
        shell: bash
        run: |
          set -euo pipefail
          root="$GENTOO_ROOT"
          cpus="$(nproc)"
          mem_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"

          # Respect a cgroup v2 memory cap if the runner exposes one.
          if [[ -r /sys/fs/cgroup/memory.max ]]; then
            limit="$(cat /sys/fs/cgroup/memory.max)"
            if [[ "$limit" =~ ^[0-9]+$ ]]; then
              limit_kib=$((limit / 1024))
              (( limit_kib < mem_kib )) && mem_kib="$limit_kib"
            fi
          fi

          # Use moderate oversubscription on the standard 4-vCPU / ~16-GB
          # runner. Start at -j8; don't increase to -j12 without measured benefit.
          if (( cpus >= 4 && mem_kib >= 9000000 )); then
            jobs=8
          elif (( cpus >= 4 && mem_kib >= 6000000 )); then
            jobs=6
          elif (( cpus >= 2 && mem_kib >= 7000000 )); then
            jobs=4
          elif (( cpus >= 2 && mem_kib >= 3500000 )); then
            jobs=2
          else
            jobs=1
          fi

          sudo sed -i '/^MAKEOPTS=/d' "$root/etc/portage/make.conf"
          printf 'MAKEOPTS="-j%s"\n' "$jobs" |
            sudo tee -a "$root/etc/portage/make.conf" >/dev/null

          printf 'Runner resources: %s CPUs, %s KiB RAM; Portage MAKEOPTS=-j%s\n' \
            "$cpus" "$mem_kib" "$jobs" | tee -a "$GITHUB_STEP_SUMMARY"
          sudo chroot "$root" /bin/bash -lc 'printf "Effective MAKEOPTS="; portageq envvar MAKEOPTS'

      - name: Verify effective D630 Portage and binary-package settings
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gentoo-builder/portage-config-check.log"
          sudo chroot "$GENTOO_ROOT" /bin/bash -lc '
            set -euo pipefail
            features="$(portageq envvar FEATURES)"
            pkgdir="$(portageq envvar PKGDIR)"
            video_cards="$(portageq envvar VIDEO_CARDS)"
            common_flags="$(portageq envvar COMMON_FLAGS)"
            makeopts="$(portageq envvar MAKEOPTS)"
            accept_keywords="$(portageq envvar ACCEPT_KEYWORDS)"
            printf "FEATURES=%s\nPKGDIR=%s\nVIDEO_CARDS=%s\nCOMMON_FLAGS=%s\nMAKEOPTS=%s\nACCEPT_KEYWORDS=%s\n" "$features" "$pkgdir" "$video_cards" "$common_flags" "$makeopts" "$accept_keywords"
            [[ " $features " == *" buildpkg "* ]] || { echo "ERROR: FEATURES lacks buildpkg." >&2; exit 1; }
            [[ "$pkgdir" == "/var/cache/binpkgs" ]] || { echo "ERROR: unexpected PKGDIR." >&2; exit 1; }
            [[ "$video_cards" == "intel" ]] || { echo "ERROR: VIDEO_CARDS is not intel." >&2; exit 1; }
            [[ "$common_flags" == *"-march=core2"* && "$common_flags" == *"-mtune=core2"* ]] ||
              { echo "ERROR: compiler flags do not target Core 2." >&2; exit 1; }
            [[ "$makeopts" =~ -j(1[0-2]|[1-9]) ]] || { echo "ERROR: MAKEOPTS was not resource-tuned." >&2; exit 1; }
            grep -F -- "media-libs/mesa -llvm -vulkan VIDEO_CARDS: -* intel" /etc/portage/package.use/10-d630-hardware >/dev/null ||
              { echo "ERROR: D630 Mesa package.use line missing." >&2; exit 1; }
            grep -R -F -- "LLVM_TARGETS:" /etc/portage/profile/package.use.force >/dev/null ||
              { echo "ERROR: local LLVM target override missing." >&2; exit 1; }
            mkdir -p "$pkgdir"
            test -w "$pkgdir" || { echo "ERROR: PKGDIR is not writable." >&2; exit 1; }
            echo "Portage target and binpkg checks passed."
          ' |& tee "$log"
          tee -a "$GITHUB_STEP_SUMMARY" < "$log"

      - name: Generate UTF-8 locale for Gentoo shell sessions
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gentoo-builder/locale.log"
          if sudo chroot "$GENTOO_ROOT" /usr/bin/env -u LC_ALL -u LC_CTYPE -u LC_MESSAGES -u LANGUAGE LANG=C /bin/bash -c '
            set -e
            if command -v locale-gen >/dev/null 2>&1; then
              locale-gen
            else
              localedef -i en_US -f UTF-8 en_US.UTF-8
            fi
            env-update
            locale -a
          ' |& tee "$log"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$log"
          else
            echo 'WARNING: en_US.UTF-8 generation failed; SSH sessions may show locale warnings.' |
              tee -a "$GITHUB_STEP_SUMMARY"
            tail -n 40 "$log" || true
          fi

      - name: Import optional previous binary-package release
        if: env.BINPKG_RUN_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gentoo-binpkg-import"
          mkdir -p "$work"
          api="https://api.github.com/repos/AmrUser-48/d630-gentoo/releases/tags/binpkgs-$BINPKG_RUN_ID"

          curl --fail --location --retry 3 --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: d630-gentoo-binpkg-importer' \
            "$api" -o "$work/release.json"

          python3 - "$work/release.json" > "$work/assets.tsv" <<'PY'
          import json, re, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              release = json.load(f)
          assets = release.get("assets", [])
          sums = [a for a in assets if a.get("name") == "SHA256SUMS"]
          parts = sorted(
              (a for a in assets if re.fullmatch(r"binpkgs-part-\d+\.tar\.zst", a.get("name", ""))),
              key=lambda a: a["name"],
          )
          if not sums or not parts:
              raise SystemExit("Release has no binpkg shards or SHA256SUMS.")
          for asset in [sums[0], *parts]:
              print(f'{asset["name"]}\t{asset["browser_download_url"]}')
          PY

          sums_url="$(awk -F '\t' '$1 == "SHA256SUMS" {print $2; exit}' "$work/assets.tsv")"
          curl --fail --location --retry 3 --silent --show-error "$sums_url" -o "$work/SHA256SUMS"

          sudo mkdir -p "$GENTOO_ROOT/var/cache/binpkgs"
          imported=0
          while IFS=
            [[ "$name" == "SHA256SUMS" ]] && continue
            [[ "$name" =~ ^binpkgs-part-[0-9]+\.tar\.zst$ ]] || continue
            echo "Downloading prior binpkg shard: $name"
            curl --fail --location --retry 3 --silent --show-error "$url" -o "$work/$name"
            (cd "$work" && sha256sum --check --ignore-missing SHA256SUMS)
            sudo tar --use-compress-program=unzstd -xf "$work/$name" -C "$GENTOO_ROOT/var/cache/binpkgs"
            rm -f "$work/$name"
            imported=$((imported + 1))
          done < "$work/assets.tsv"

          (( imported > 0 )) || { echo 'No binpkg shards imported.' >&2; exit 1; }
          sudo chroot "$GENTOO_ROOT" /bin/bash -lc 'emaint binhost --fix'
          {
            echo "Imported $imported binary-package shard(s) from release binpkgs-$BINPKG_RUN_ID."
            echo "Portage will reuse compatible packages with --usepkg and build missing/incompatible packages from source."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sync the Gentoo ebuild repository
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gentoo-builder/portage-sync.log"
          if ! sudo chroot "$GENTOO_ROOT" /bin/bash -lc 'emerge-webrsync --quiet' |& tee "$log"; then
            echo 'emerge-webrsync failed; trying the configured Portage sync method.' | tee -a "$log"
            sudo chroot "$GENTOO_ROOT" /bin/bash -lc 'emerge --ignore-default-opts --sync --quiet' |& tee -a "$log"
          fi
          tail -n 40 "$log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Connect runner to private Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          use-cache: "true"

      - name: Configure key-only SSH directly into the Gentoo chroot
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gentoo-builder"
          ssh_key="${SSH_PUBLIC_KEY//$'\r'/}"
          ssh_key="${ssh_key%$'\n'}"
          tailnet_ip="$(tailscale ip -4 | awk '/^100\./ {print; exit}')"
          [[ "$tailnet_ip" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] ||
            { echo 'Tailscale IPv4 address not found.' >&2; exit 1; }
          printf 'TAILSCALE_IP=%s\n' "$tailnet_ip" >> "$GITHUB_ENV"

          sudo useradd --create-home --shell /bin/bash gentoo 2>/dev/null || true
          sudo install -d -o gentoo -g gentoo -m 0700 /home/gentoo/.ssh
          printf 'from="100.64.0.0/10",no-agent-forwarding,no-X11-forwarding %s\n' "$ssh_key" |
            sudo tee /home/gentoo/.ssh/authorized_keys >/dev/null
          sudo chown gentoo:gentoo /home/gentoo/.ssh/authorized_keys
          sudo chmod 0600 /home/gentoo/.ssh/authorized_keys

          sudo tee /etc/ssh/sshd_config.d/00-gentoo-builder.conf >/dev/null <<'EOF'
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers gentoo
          EOF

          sudo tee /etc/sudoers.d/gentoo-chroot >/dev/null <<'EOF'
          gentoo ALL=(root) NOPASSWD: /usr/sbin/chroot /opt/gentoo /bin/bash --login
          EOF
          sudo chmod 0440 /etc/sudoers.d/gentoo-chroot
          sudo visudo -cf /etc/sudoers.d/gentoo-chroot

          # Force an SSH login into the Gentoo rootfs. The account is only
          # reachable using the one public key over the private Tailscale IP.
          sudo tee -a /etc/ssh/sshd_config >/dev/null <<'EOF'

          Match User gentoo
              ForceCommand /usr/bin/sudo -n /usr/sbin/chroot /opt/gentoo /bin/bash --login
              PermitTTY yes
              AllowTcpForwarding no
              X11Forwarding no
              PermitTunnel no
          EOF

          # Ubuntu GitHub runners may not have sshd's privilege-separation dir.
          # Create it before sshd -t so the daemon can validate and start.
          sudo install -d -o root -g root -m 0755 /run/sshd
          sudo sshd -t
          sudo systemctl restart ssh
          sudo systemctl is-active --quiet ssh
          sudo iptables -I INPUT 1 -i tailscale0 -s 100.64.0.0/10 -p tcp --dport 22 -j ACCEPT
          sudo iptables -I INPUT 2 -p tcp --dport 22 -j DROP
          ssh-keygen -lf "$RUNNER_TEMP/ssh_public_key.pub" |
            tee "$report/ssh-key-fingerprint.txt"
          {
            echo '## Gentoo SSH session ready'
            echo "- Gentoo login: ssh -tt -i ~/.ssh/id_ed25519_macos_runner -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o PasswordAuthentication=no gentoo@$tailnet_ip"
            echo '- SSH account password authentication is disabled; SSH is filtered to Tailscale IPv4 peers.'
            echo '- The SSH login is forced directly into the Gentoo chroot as root.'
            echo '- The session is temporary; the host and chroot disappear when the job ends.'
          } | tee -a "$GITHUB_STEP_SUMMARY" | tee "$report/remote-access.txt"
          echo '- Optional Gentoo builder utilities may still be compiling in the next step; SSH is already available. Check /var/log/emerge.log inside Gentoo. Utilities bootstrap is best-effort and capped at 35 minutes.' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Gentoo builder utilities
        id: builder-tools
        continue-on-error: true
        timeout-minutes: 37
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gentoo-builder/runner-tools.log"
          if timeout 35m sudo chroot "$GENTOO_ROOT" /bin/bash -lc '/usr/local/sbin/gentoo-build-set runner-tools' |& tee "$log"; then
            echo 'Builder utilities installed.' | tee -a "$GITHUB_STEP_SUMMARY"
            sudo chroot "$GENTOO_ROOT" /bin/bash -lc 'eix-update' |& tee -a "$log" || true
          else
            echo 'WARNING: one or more optional builder utilities failed to build. SSH remains available; inspect runner-tools.log.' |
              tee -a "$GITHUB_STEP_SUMMARY"
            tail -n 60 "$log" || true
          fi

      - name: Verify Byobu permissions and Bash completion setup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          log="$RUNNER_TEMP/gentoo-builder/runner-tools.log"
          sudo chroot "$GENTOO_ROOT" /bin/bash -lc '
            set -u
            # Some package/archive paths can leave interpreter scripts without +x.
            # Check the actual target for both symlinks and regular files.
            found_byobu=0
            for path in /usr/bin/byobu /usr/bin/byobu-*; do
              [[ -e "$path" ]] || continue
              found_byobu=1
