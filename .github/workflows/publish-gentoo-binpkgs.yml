name: Publish existing Gentoo binpkgs artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Numeric run ID of the Gentoo builder run; defaults to the release that failed to publish
        required: true
        type: string
        default: "38417494509"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish binpkgs and optional kernel/initramfs bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out package exporter/importer
        uses: actions/checkout@v4

      - name: Validate source run ID
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "source_run_id must be numeric." >&2; exit 2; }
          echo "Using this workflow's GITHUB_TOKEN with actions:read and contents:write permissions."

      - name: Download the completed runner artifact
        uses: actions/download-artifact@v4
        with:
          name: gentoo-build-output-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/source-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd tar coreutils python3
          sudo apt-get clean

      - name: Package binpkgs and optional boot bundle
        id: package
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PUBLISHER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          source_dir="${RUNNER_TEMP}/source-artifact/binpkgs"
          release_dir="${RUNNER_TEMP}/release-assets"
          prepared_dir="${RUNNER_TEMP}/source-artifact/release"

          # Reuse the release assets already prepared by the source builder.
          # This avoids recompressing packages after a release-permission failure.
          if [[ -d "$prepared_dir" && -s "$prepared_dir/BUILD-MANIFEST.txt" && -s "$prepared_dir/SHA256SUMS" ]]; then
            mkdir -p "$release_dir"
            cp -a "$prepared_dir/." "$release_dir/"
            (
              cd "$release_dir"
              sha256sum --check SHA256SUMS
            )
            target_sha="$(sed -n 's/^Source commit: //p' "$release_dir/BUILD-MANIFEST.txt" | head -n 1)"
            [[ "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "Prepared release manifest has no valid source commit SHA." >&2
              exit 1
            }
            echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "Reused prepared release assets; no package rebuilding or re-archiving required."
            find "$release_dir" -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
            exit 0
          fi

          [[ -d "$source_dir" ]] || {
            echo "The selected artifact contains no binpkgs/ directory." >&2
            find "${RUNNER_TEMP}/source-artifact" -maxdepth 3 -type f | head -n 80 || true
            exit 1
          }
          mkdir -p "$release_dir"
          if [[ -d "${RUNNER_TEMP}/source-artifact/session-snapshot" ]]; then
            tar --zstd -cf "$release_dir/SESSION-SNAPSHOT.tar.zst" -C "${RUNNER_TEMP}/source-artifact" session-snapshot
          fi

          if find "$source_dir" -type f \( -name '*.gpkg.tar' -o -name '*.tbz2' \) -print -quit | grep -q .; then
            bash scripts/package-binpkgs-release.sh "$source_dir" "$release_dir"
            has_packages=true
          else
            printf '%s\n' '# No Gentoo binary packages were produced in this session.' > "$release_dir/PACKAGE-LIST.txt"
            has_packages=false
          fi

          # Works with old in-progress runner jobs: they already collect all of
          # /var/cache/binpkgs into this artifact directory.
          for input_dir in "$source_dir" "${RUNNER_TEMP}/source-artifact/boot-bundle"; do
            [[ -d "$input_dir" ]] || continue
            for pattern in kernel initramfs KERNELRELEASE.txt 'modules-*.tar.zst' d630-firmware.tar.zst \
                           'd630-*.config' FIRMWARE-SOURCES.txt KERNEL-BUILD-MANIFEST.txt; do
              for source in "$input_dir"/$pattern; do
                [[ -f "$source" ]] || continue
                cp -p "$source" "$release_dir/"
              done
            done
          done

          if [[ -s "$release_dir/kernel" || -s "$release_dir/initramfs" ]]; then
            [[ -s "$release_dir/kernel" && -s "$release_dir/initramfs" ]] || {
              echo "A boot bundle must contain both kernel and initramfs." >&2; exit 1;
            }
            module_archive="$(find "$release_dir" -maxdepth 1 -name 'modules-*.tar.zst' -print -quit)"
            if [[ -n "$module_archive" ]]; then
              [[ -s "$release_dir/KERNELRELEASE.txt" ]] || {
                echo "Module archive supplied without KERNELRELEASE.txt." >&2; exit 1;
              }
              kernel_release="$(tr -d '\r\n' < "$release_dir/KERNELRELEASE.txt")"
              [[ "$kernel_release" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "Invalid KERNELRELEASE.txt." >&2; exit 1; }
              tar --use-compress-program=unzstd -tf "$module_archive" |
                grep -Fx "lib/modules/$kernel_release/" >/dev/null || {
                  echo "Module archive does not contain lib/modules/$kernel_release/." >&2; exit 1;
                }
            fi
            file "$release_dir/kernel" "$release_dir/initramfs" > "$release_dir/BOOT-FILES.txt"
          fi

          if [[ "$has_packages" != true && ! -s "$release_dir/kernel" ]]; then
            echo "No binary packages or complete kernel/initramfs bundle found." >&2
            exit 1
          fi

          {
            echo "Target: amd64 / glibc / OpenRC Gentoo Stage 3"
            echo "CPU target: Intel Core 2 / Merom"
            echo "CFLAGS: -O2 -pipe -march=core2 -mtune=core2"
            echo "Source workflow run: $SOURCE_RUN_ID"
            echo "Source artifact: gentoo-build-output-$SOURCE_RUN_ID"
            echo "Release tag: binpkgs-$SOURCE_RUN_ID"
            if [[ "$has_packages" == true ]]; then
              echo "Contains binary package shards from the source runner."
            else
              echo "No binary package shards; this is a boot-bundle-only release."
            fi
            [[ ! -s "$release_dir/kernel" ]] || echo "Kernel and external initramfs are included."
            [[ ! -s "$release_dir/KERNELRELEASE.txt" ]] || echo "Kernel release: $(cat "$release_dir/KERNELRELEASE.txt")"
            echo "Never use a module archive with a different kernel release."
          } > "$release_dir/BUILD-MANIFEST.txt"

          (
            cd "$release_dir"
            : > SHA256SUMS
            for asset in *; do
              [[ -f "$asset" && "$asset" != SHA256SUMS ]] || continue
              sha256sum "$asset" >> SHA256SUMS
            done
          )
          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "target_sha=$PUBLISHER_SHA" >> "$GITHUB_OUTPUT"
          find "$release_dir" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort

      - name: Publish persistent GitHub Release
        if: steps.package.outputs.has_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: binpkgs-${{ inputs.source_run_id }}
          name: "D630 Gentoo packages and optional boot bundle — run ${{ inputs.source_run_id }}"
          target_commitish: ${{ steps.package.outputs.target_sha }}
          prerelease: true
          make_latest: false
          draft: false
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: "${{ runner.temp }}/release-assets/*"
