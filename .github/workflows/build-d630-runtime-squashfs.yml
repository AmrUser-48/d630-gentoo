name: Build D630 Gentoo runtime SquashFS
run-name: "D630 rootfs • ${{ inputs.runtime_profile }} • run ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      runtime_profile:
        description: Runtime image contents
        required: true
        type: choice
        options:
          - tiny-console
          - console
          - desktop
          - daily-driver
        default: tiny-console
      prepared_assets_run_id:
        description: "Actions run ID of Prepare existing Gentoo assets; downloads its d630-gentoo-assets artifact"
        required: false
        type: string
        default: ""
      binpkg_run_ids:
        description: "Optional legacy binpkgs release run IDs, separated by commas or spaces (use prepared_assets_run_id for the recovered artifact)"
        required: false
        type: string
        default: ""
      source_fallback:
        description: Allow Portage to compile missing/incompatible packages (may take hours)
        required: true
        type: boolean
        default: false
      kernel_bundle_tag:
        description: "Optional release tag containing matching modules-*.tar.zst and d630-firmware.tar.zst"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: d630-runtime-squashfs
  cancel-in-progress: false

jobs:
  build:
    name: Assemble runtime root and SquashFS
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      PREPARED_ASSETS_RUN_ID: ${{ inputs.prepared_assets_run_id }}
      BINPKG_RUN_IDS: ${{ inputs.binpkg_run_ids || '' }}
      SOURCE_FALLBACK: ${{ inputs.source_fallback }}
      KERNEL_BUNDLE_TAG: ${{ inputs.kernel_bundle_tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out D630 Gentoo configuration
        uses: actions/checkout@v4

      - name: Validate prepared-assets run ID
        if: inputs.prepared_assets_run_id != ''
        shell: bash
        env:
          PREPARED_ASSETS_RUN_ID: ${{ inputs.prepared_assets_run_id }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_ASSETS_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "prepared_assets_run_id must be a numeric GitHub Actions run ID." >&2
            exit 2
          }

      - name: Download recovered Gentoo assets artifact
        if: inputs.prepared_assets_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: d630-gentoo-assets
          path: ${{ runner.temp }}/prepared-release-assets
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepared_assets_run_id }}
          github-token: ${{ github.token }}

      - name: Install host tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl python3 tar xz-utils zstd rsync squashfs-tools \
            e2fsprogs util-linux gzip
          sudo apt-get clean
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assemble Gentoo runtime and build SquashFS
        shell: bash
        env:
          LOCAL_RELEASE_ASSETS_DIR: ${{ inputs.prepared_assets_run_id != '' && format('{0}/prepared-release-assets', runner.temp) || '' }}
        run: |
          set -Eeuo pipefail
          sudo --preserve-env=RUNTIME_PROFILE,BINPKG_RUN_IDS,LOCAL_RELEASE_ASSETS_DIR,SOURCE_FALLBACK,KERNEL_BUNDLE_TAG,GH_TOKEN,RUNNER_TEMP,GITHUB_WORKSPACE,GITHUB_REPOSITORY,GITHUB_STEP_SUMMARY \
            bash scripts/build-runtime-squashfs.sh

      - name: Upload SquashFS and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d630-squashfs-${{ inputs.runtime_profile }}-run-${{ github.run_number }}
          path: |
            output/squashfs
            output/kernel
            output/initramfs
            output/KERNELRELEASE.txt
            output/KERNEL-BUILD-MANIFEST.txt
            output/SOURCE-BUILD-MANIFEST.txt
            output/LOCAL-BINPKG-IMPORT.txt
            output/PREPARED-ASSET-CHECK.log
            output/SHA256SUMS
            output/RUNTIME-MANIFEST.txt
            output/RELEASE-NOTES.md
            output/PACKAGES.txt
            output/INSTALLED-PACKAGES.txt
            output/EMERGE-INFO.txt
            output/BUILD-INPUTS.txt
            output/STAGE3-MANIFEST.txt
            output/PORTAGE-TARGET.txt
            output/SQUASHFS-INFO.txt
            output/INIT-PROBE.txt
            output/KERNEL-MODULES.txt
            output/portage-bootstrap.log
            output/emerge-runtime.log
            output/depclean.log
            output/locale.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Summarize bootable artifact
        if: success()
        shell: bash
        run: |
          {
            echo "### D630 Gentoo boot bundle is ready"
            echo
            echo "Download Actions artifact d630-squashfs-${{ inputs.runtime_profile }}-run-${{ github.run_number }} from this workflow run."
            echo "It contains kernel, initramfs, and squashfs, plus checksums and build manifests."
            echo
            echo "No GitHub Release API is used; delivery uses Actions artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
