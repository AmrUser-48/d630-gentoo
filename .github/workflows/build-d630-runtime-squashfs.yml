name: Build D630 Gentoo runtime SquashFS
run-name: "D630 rootfs • ${{ github.event_name == 'push' && 'openbox' || inputs.runtime_profile }} • run ${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - "d630-gentoo/scripts/build-runtime-squashfs.sh"
      - "d630-gentoo/scripts/build-squashfs.sh"
      - "d630-gentoo/config/package-sets/**"
      - "d630-gentoo/config/runtime/d630-firstboot"
      - "d630-gentoo/config/desktop/**"
      - "config/portage/package.use/10-d630-hardware"
      - "config/portage/package.use/60-d630-firmware-busybox"
      - "config/portage/package.license"
      - "config/portage/savedconfig/**"
      - "d630-gentoo/config/busybox/**"
      - "d630-gentoo/config/firmware.keep"
  workflow_dispatch:
    inputs:
      runtime_profile:
        description: Runtime image contents
        required: true
        type: choice
        options:
          - tiny-console
          - console
          - openbox
          - desktop
          - daily-driver
        default: tiny-console
      prepared_assets_run_id:
        description: "Actions run ID of Prepare existing Gentoo assets; downloads its d630-gentoo-assets artifact"
        required: false
        type: string
        default: ""
      binpkg_run_ids:
        description: "Binpkg release run IDs, separated by commas or spaces; the default pair contains the Mesa baseline and latest Core 2 package set"
        required: false
        type: string
        default: "39507549274,41307968832"
      source_fallback:
        description: "Allow source builds for missing packages. Keep false for strict binpkg-only assembly; missing or mismatched binpkgs then fail fast."
        required: true
        type: boolean
        default: false
      kernel_bundle_tag:
        description: "Release tag containing the matching kernel, initramfs, modules and firmware bundle"
        required: false
        type: string
        default: "d630-kernel-6.18.56-run-41317026490"

permissions:
  actions: read
  contents: read

concurrency:
  group: d630-runtime-squashfs
  cancel-in-progress: false

jobs:
  build:
    # Changes to the runtime builder trigger the strict binpkg-only Openbox build.
    # workflow_dispatch remains available for alternate profiles and asset inputs.
    name: Assemble runtime root and SquashFS
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUNTIME_PROFILE: ${{ github.event_name == 'push' && 'openbox' || inputs.runtime_profile }}
      PREPARED_ASSETS_RUN_ID: ${{ inputs.prepared_assets_run_id || '' }}
      BINPKG_RUN_IDS: ${{ github.event_name == 'push' && '39507549274,41307968832' || inputs.binpkg_run_ids || '' }}
      SOURCE_FALLBACK: ${{ github.event_name == 'push' && 'false' || (inputs.source_fallback && 'true' || (inputs.runtime_profile == 'tiny-console' && inputs.prepared_assets_run_id == '' && inputs.binpkg_run_ids == '' && 'true') || 'false') }}
      KERNEL_BUNDLE_TAG: ${{ github.event_name == 'push' && 'd630-kernel-6.18.56-run-41317026490' || inputs.kernel_bundle_tag || '' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out D630 Gentoo configuration
        uses: actions/checkout@v4

      - name: Validate prepared-assets run ID
        if: inputs.prepared_assets_run_id != ''
        shell: bash
        env:
          PREPARED_ASSETS_RUN_ID: ${{ inputs.prepared_assets_run_id }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_ASSETS_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "prepared_assets_run_id must be a numeric GitHub Actions run ID." >&2
            exit 2
          }

      - name: Require Mesa binpkg input for Openbox SquashFS
        if: inputs.runtime_profile == 'openbox' || github.event_name == 'push'
        shell: bash
        env:
          PREPARED_ASSETS_RUN_ID: ${{ inputs.prepared_assets_run_id || '' }}
          BINPKG_RUN_IDS: ${{ github.event_name == 'push' && '39507549274,41307968832' || inputs.binpkg_run_ids || '' }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PREPARED_ASSETS_RUN_ID" || -n "$BINPKG_RUN_IDS" ]] || {
            echo "::error::The Openbox SquashFS profile requires an imported binpkg release containing Mesa."
            exit 1
          }

      - name: Download recovered Gentoo assets artifact
        if: inputs.prepared_assets_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: d630-gentoo-assets
          path: ${{ runner.temp }}/prepared-release-assets
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepared_assets_run_id }}
          github-token: ${{ github.token }}

      - name: Install host tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 tar xz-utils zstd rsync squashfs-tools \
            e2fsprogs util-linux gzip
          sudo apt-get clean
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assemble Gentoo runtime and build SquashFS
        shell: bash
        env:
          LOCAL_RELEASE_ASSETS_DIR: ${{ inputs.prepared_assets_run_id != '' && format('{0}/prepared-release-assets', runner.temp) || '' }}
        run: |
          set -Eeuo pipefail
          sudo --preserve-env=RUNTIME_PROFILE,BINPKG_RUN_IDS,LOCAL_RELEASE_ASSETS_DIR,SOURCE_FALLBACK,KERNEL_BUNDLE_TAG,GH_TOKEN,RUNNER_TEMP,GITHUB_WORKSPACE,GITHUB_REPOSITORY,GITHUB_STEP_SUMMARY \
            bash d630-gentoo/scripts/build-runtime-squashfs.sh

      - name: Upload SquashFS and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d630-squashfs-${{ github.event_name == 'push' && 'openbox' || inputs.runtime_profile }}-run-${{ github.run_number }}
          path: |
            output/squashfs
            output/kernel
            output/initramfs
            output/KERNELRELEASE.txt
            output/KERNEL-BUILD-MANIFEST.txt
            output/SOURCE-BUILD-MANIFEST.txt
            output/LOCAL-BINPKG-IMPORT.txt
            output/mesa-binpkg.log
            output/PREPARED-ASSET-CHECK.log
            output/SHA256SUMS
            output/SQUASHFS-SHA256.txt
            output/GLXGEARS-STATUS.txt
            output/BINPKG-OPTIONAL-SKIPPED.txt
            output/TOOL-AVAILABILITY.txt
            output/OPENBOX-OPTIONAL-KEYS.txt
            output/required-binpkg-plan.log
            output/INITTAB-PROBE.txt
            output/XSERVERRC-PROBE.txt
            output/RUNTIME-MANIFEST.txt
            output/RELEASE-NOTES.md
            output/PACKAGES.txt
            output/INSTALLED-PACKAGES.txt
            output/EMERGE-INFO.txt
            output/BUILD-INPUTS.txt
            output/STAGE3-MANIFEST.txt
            output/PORTAGE-TARGET.txt
            output/SQUASHFS-INFO.txt
            output/INIT-PROBE.txt
            output/KERNEL-MODULES.txt
            output/official-binpkg-fallback.log
            output/pipewire-binpkg-plan.log
            output/pipewire-binpkg-fallback.log
            output/pipewire-binpkg-install.log
            output/SCRCPY-BUNDLE-SHA256.txt
            output/scrcpy-ldd.txt
            output/portage-bootstrap.log
            output/emerge-runtime.log
            output/depclean.log
            output/locale.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Summarize bootable artifact
        if: success()
        shell: bash
        run: |
          {
            echo "### D630 Gentoo boot bundle is ready"
            echo
            echo "Download Actions artifact d630-squashfs-${{ github.event_name == 'push' && 'openbox' || inputs.runtime_profile }}-run-${{ github.run_number }} from this workflow run."
            echo "It contains kernel, initramfs, and squashfs, plus checksums and build manifests."
            echo
            echo "No GitHub Release API is used; delivery uses Actions artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
