name: Build D630 Gentoo runtime SquashFS
run-name: "D630 rootfs • ${{ inputs.runtime_profile }} • run ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      runtime_profile:
        description: Runtime image contents
        required: true
        type: choice
        options:
          - console
          - desktop
          - daily-driver
        default: console
      binpkg_run_ids:
        description: "One or more numeric binpkgs release run IDs, separated by commas or spaces"
        required: true
        type: string
      source_fallback:
        description: Allow Portage to compile missing/incompatible packages (may take hours)
        required: true
        type: boolean
        default: false
      kernel_bundle_tag:
        description: "Optional release tag containing matching modules-*.tar.zst and d630-firmware.tar.zst"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: d630-runtime-squashfs
  cancel-in-progress: false

jobs:
  build:
    name: Assemble runtime root and SquashFS
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      BINPKG_RUN_IDS: ${{ inputs.binpkg_run_ids }}
      SOURCE_FALLBACK: ${{ inputs.source_fallback }}
      KERNEL_BUNDLE_TAG: ${{ inputs.kernel_bundle_tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out D630 Gentoo configuration
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl python3 tar xz-utils zstd rsync squashfs-tools \
            e2fsprogs util-linux gzip
          sudo apt-get clean
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assemble Gentoo runtime and build SquashFS
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo --preserve-env=RUNTIME_PROFILE,BINPKG_RUN_IDS,SOURCE_FALLBACK,KERNEL_BUNDLE_TAG,GH_TOKEN,RUNNER_TEMP,GITHUB_WORKSPACE,GITHUB_REPOSITORY,GITHUB_STEP_SUMMARY \
            bash scripts/build-runtime-squashfs.sh

      - name: Upload SquashFS and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d630-squashfs-${{ inputs.runtime_profile }}-run-${{ github.run_number }}
          path: |
            output/squashfs
            output/SHA256SUMS
            output/RUNTIME-MANIFEST.txt
            output/RELEASE-NOTES.md
            output/PACKAGES.txt
            output/INSTALLED-PACKAGES.txt
            output/EMERGE-INFO.txt
            output/BUILD-INPUTS.txt
            output/STAGE3-MANIFEST.txt
            output/PORTAGE-TARGET.txt
            output/SQUASHFS-INFO.txt
            output/INIT-PROBE.txt
            output/KERNEL-MODULES.txt
            output/portage-bootstrap.log
            output/emerge-runtime.log
            output/depclean.log
            output/locale.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Publish durable runtime SquashFS release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: d630-rootfs-${{ inputs.runtime_profile }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          name: "D630 Gentoo runtime SquashFS — ${{ inputs.runtime_profile }} — run ${{ github.run_number }}"
          body_path: output/RELEASE-NOTES.md
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          draft: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            output/squashfs
            output/SHA256SUMS
            output/RUNTIME-MANIFEST.txt
            output/RELEASE-NOTES.md
            output/PACKAGES.txt
            output/INSTALLED-PACKAGES.txt
            output/EMERGE-INFO.txt
            output/BUILD-INPUTS.txt
            output/STAGE3-MANIFEST.txt
            output/PORTAGE-TARGET.txt
            output/SQUASHFS-INFO.txt
            output/KERNEL-MODULES.txt
