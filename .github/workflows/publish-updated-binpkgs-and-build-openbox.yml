name: Publish updated Gentoo binpkgs (optional Openbox SFS)
run-name: "Core 2 binpkgs${{ inputs.build_openbox && ' + Openbox SFS' || ' only' }} • run ${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-updated-binpkgs-and-build-openbox.yml"
  workflow_dispatch:
    inputs:
      build_openbox:
        description: "Also build the Openbox SquashFS after publishing; disable for binpkgs-only publication"
        required: true
        type: boolean
        default: false
      state_tag:
        description: "Optional runner-state-* release tag; blank selects the newest saved state"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      build_openbox:
        description: "Build the strict binpkg-only Openbox SquashFS after publishing"
        required: false
        type: boolean
        default: true
      state_tag:
        description: "Encrypted runner-state-* release to restore"
        required: false
        type: string
        default: "runner-state-20261031T054241Z"
      kernel_bundle_tag:
        description: "Kernel bundle produced by the parent build workflow"
        required: false
        type: string
        default: "d630-kernel-6.18.56-run-41317026490"

permissions:
  actions: write
  contents: write

concurrency:
  group: d630-openbox-binpkgs-refresh-v4
  cancel-in-progress: false

jobs:
  publish-binpkgs:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || contains(github.event.head_commit.message, 'run binpkg refresh and build Openbox SFS') }}
    name: Restore saved Gentoo state and publish its current binpkgs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      binpkg_run_ids: ${{ steps.publish.outputs.binpkg_run_ids }}
    env:
      GENTOO_ROOT: /opt/gentoo
      GH_TOKEN: ${{ github.token }}
      STATE_TAG_INPUT: ${{ inputs.state_tag || '' }}
      STATE_ENCRYPTION_PASSPHRASE: ${{ secrets.STATE_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Check out binpkg exporter
        uses: actions/checkout@v4

      - name: Cancel obsolete SFS build using the October 20 binpkgs
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh run view 40950797127 --repo "$GITHUB_REPOSITORY" --json status --jq '.status' 2>/dev/null || true)"
          if [[ "$status" == queued || "$status" == in_progress ]]; then
            gh run cancel 40950797127 --repo "$GITHUB_REPOSITORY" ||
              echo "::warning::Could not cancel the obsolete SFS run; continuing with the updated build."
          else
            echo "The previous SFS run is already $status; no cancellation needed."
          fi

      - name: Install state restore and binpkg archive tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl coreutils gpg jq tar zstd python3
          sudo apt-get clean
          df -h / | tee "$RUNNER_TEMP/host-disk-before-restore.txt"

      - name: Restore the newest saved Gentoo root
        id: restore
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/gentoo-state"
          metadata="$report/metadata"
          chunks="$report/chunks"
          fifo="$report/rootfs-stream.fifo"
          mkdir -p "$metadata" "$chunks"

          state_tag="$STATE_TAG_INPUT"
          if [[ -z "$state_tag" ]]; then
            state_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,publishedAt \
              --jq '[.[] | select(.tagName | startswith("runner-state-"))] | sort_by(.publishedAt) | last | .tagName // empty')"
          fi
          [[ "$state_tag" =~ ^runner-state-[A-Za-z0-9._-]+$ ]] || {
            echo "No valid runner-state-* release was found." >&2
            exit 1
          }
          gh release download "$state_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern manifest.txt --pattern SHARD-SHA256SUMS --dir "$metadata"
          [[ -s "$metadata/manifest.txt" && -s "$metadata/SHARD-SHA256SUMS" ]] || {
            echo "Saved state is missing its manifest or checksums." >&2
            exit 1
          }

          if grep -Fxq 'Archive format: gpg-aes256-encrypted-zstd-tar' "$metadata/manifest.txt"; then
            state_encrypted=true
            part_prefix="gentoo-rootfs.tar.zst.gpg.part-"
            [[ -n "${STATE_ENCRYPTION_PASSPHRASE:-}" ]] || {
              echo "Missing Actions secret STATE_ENCRYPTION_PASSPHRASE." >&2
              exit 1
            }
          else
            state_encrypted=false
            part_prefix="gentoo-rootfs.tar.zst.part-"
          fi

          if [[ "$state_encrypted" == true ]]; then
            mapfile -t parts < <(gh release view "$state_tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | select(.name | startswith("gentoo-rootfs.tar.zst.gpg.part-")) | .name' | sort)
          else
            mapfile -t parts < <(gh release view "$state_tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | select(.name | startswith("gentoo-rootfs.tar.zst.part-")) | .name' | sort)
          fi
          (( ${#parts[@]} > 0 )) || {
            echo "Release $state_tag has no state chunks matching $part_prefix." >&2
            exit 1
          }
          diff -u \
            <(printf '%s\n' "${parts[@]}") \
            <(awk 'NF >= 2 {name=$2; sub(/^\*/, "", name); print name}' "$metadata/SHARD-SHA256SUMS" | sort) || {
              echo "State release chunk list does not match its checksum manifest." >&2
              exit 1
            }

          if [[ -e "$GENTOO_ROOT" ]] && find "$GENTOO_ROOT" -mindepth 1 -print -quit | grep -q .; then
            echo "$GENTOO_ROOT exists and is not empty; refusing to overwrite it." >&2
            exit 1
          fi
          sudo install -d -m 0755 "$GENTOO_ROOT"
          avail_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          if [[ ! "$avail_kib" =~ ^[0-9]+$ ]] || (( avail_kib < 3145728 )); then
            echo "Less than 3 GiB free for restoring the saved state." >&2
            df -h / >&2
            exit 1
          fi
          df -h / | tee "$report/host-disk-before-extract.txt"
          printf 'Selected state: %s\n' "$state_tag" | tee "$report/selected-state.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$metadata/manifest.txt" "$report/manifest.txt"

          mkfifo "$fifo"
          extract_pid=""
          cleanup_restore() {
            exec 3>&- 2>/dev/null || true
            if [[ -n "${extract_pid:-}" ]]; then kill "$extract_pid" 2>/dev/null || true; fi
            rm -f "$fifo"
          }
          trap cleanup_restore EXIT
          if [[ "$state_encrypted" == true ]]; then
            (
              set -euo pipefail
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
                < "$fifo" 3< <(printf '%s\n' "$STATE_ENCRYPTION_PASSPHRASE") |
                zstd --decompress --stdout |
                sudo tar --extract --file=- --directory="$GENTOO_ROOT" \
                  --numeric-owner --same-permissions --acls --xattrs --xattrs-include='*' --sparse
            ) > "$report/extract.log" 2>&1 &
          else
            (
              set -euo pipefail
              zstd --decompress --stdout < "$fifo" |
                sudo tar --extract --file=- --directory="$GENTOO_ROOT" \
                  --numeric-owner --same-permissions --acls --xattrs --xattrs-include='*' --sparse
            ) > "$report/extract.log" 2>&1 &
          fi
          extract_pid=$!
          exec 3>"$fifo"
          for part in "${parts[@]}"; do
            echo "Downloading and verifying $part"
            gh release download "$state_tag" --repo "$GITHUB_REPOSITORY" --pattern "$part" --dir "$chunks"
            expected="$(awk -v name="$part" '$2 == name {print $1}' "$metadata/SHARD-SHA256SUMS")"
            [[ "$expected" =~ ^[[:xdigit:]]{64}$ ]] || {
              echo "No valid SHA-256 for $part." >&2; exit 1;
            }
            (cd "$chunks" && printf '%s  %s\n' "$expected" "$part" | sha256sum --check -)
            cat "$chunks/$part" >&3
            rm -f "$chunks/$part"
          done
          exec 3>&-
          if ! wait "$extract_pid"; then
            echo "Root filesystem extraction failed; last log lines:" >&2
            tail -n 100 "$report/extract.log" >&2 || true
            exit 1
          fi
          extract_pid=""
          trap - EXIT
          rm -f "$fifo"
          sudo test -s "$GENTOO_ROOT/etc/gentoo-release"
          sudo test -x "$GENTOO_ROOT/usr/bin/emerge" || sudo test -x "$GENTOO_ROOT/usr/bin/emerge-webrsync"
          echo "STATE_TAG=$state_tag" >> "$GITHUB_ENV"
          echo "Restored and validated Gentoo root from $state_tag."
          df -h / | tee "$report/host-disk-after-restore.txt"

      - name: Build missing D630 runtime packages as Core 2 binpkgs
        shell: bash
        run: |
          set -Eeuo pipefail

          # Apply the exact D630 build policy used by the package cache.
          sudo install -D -m 0644 config/portage/make.conf \
            "$GENTOO_ROOT/etc/portage/make.conf"
          sudo install -d -m 0755 \
            "$GENTOO_ROOT/etc/portage/package.use" \
            "$GENTOO_ROOT/etc/portage/package.accept_keywords" \
            "$GENTOO_ROOT/etc/portage/env"
          for file in config/portage/package.use/*; do
            sudo install -m 0644 "$file" "$GENTOO_ROOT/etc/portage/package.use/$(basename "$file")"
          done
          for file in config/portage/package.accept_keywords/*; do
            sudo install -m 0644 "$file" "$GENTOO_ROOT/etc/portage/package.accept_keywords/$(basename "$file")"
          done
          sudo install -D -m 0644 config/portage/package.env \
            "$GENTOO_ROOT/etc/portage/package.env"
          sudo install -m 0644 config/portage/env/custom-opt.conf \
            "$GENTOO_ROOT/etc/portage/env/custom-opt.conf"

          # Recreate writable temporary paths omitted from the saved state archive.
          sudo install -d -m 1777 "$GENTOO_ROOT/tmp" "$GENTOO_ROOT/var/tmp"
          sudo install -d -m 0755 \
            "$GENTOO_ROOT/var/tmp/portage" "$GENTOO_ROOT/var/cache/distfiles"
          sudo chroot "$GENTOO_ROOT" chown portage:portage \
            /var/tmp/portage /var/cache/distfiles
          sudo chroot "$GENTOO_ROOT" chmod 2775 \
            /var/tmp/portage /var/cache/distfiles

          # The encrypted state archive intentionally contains no /dev device nodes
          # and may omit the other transient mount points too.
          # Recreate the targets before bind-mounting the runner's virtual filesystems.
          sudo install -d -m 0755 "$GENTOO_ROOT/dev" "$GENTOO_ROOT/proc" \
            "$GENTOO_ROOT/sys" "$GENTOO_ROOT/run"
          for mp in dev proc sys run; do
            sudo mount --rbind "/$mp" "$GENTOO_ROOT/$mp"
            sudo mount --make-rslave "$GENTOO_ROOT/$mp"
          done
          cleanup_chroot_mounts() {
            for mp in run sys proc dev; do
              sudo umount -R "$GENTOO_ROOT/$mp" 2>/dev/null || true
            done
          }
          trap cleanup_chroot_mounts EXIT

          # Register the pinned D630 scrcpy 5.0.1 SDL3 fork as a local Portage repo.
          local_repo="$GENTOO_ROOT/var/db/repos/d630-local"
          sudo install -d -m 0755 "$local_repo/metadata" "$local_repo/app-mobilephone/scrcpy"
          sudo tee "$local_repo/metadata/layout.conf" >/dev/null <<'EOF'
          repo-name = d630-local
          masters = gentoo
          thin-manifests = true
          EOF
          sudo tee "$GENTOO_ROOT/etc/portage/repos.conf/d630-local.conf" >/dev/null <<'EOF'
          [d630-local]
          location = /var/db/repos/d630-local
          priority = 1000
          auto-sync = no
          EOF
          sudo install -m 0644 \
            config/portage/local-overlay/app-mobilephone/scrcpy/scrcpy-5.0.1.ebuild \
            "$local_repo/app-mobilephone/scrcpy/scrcpy-5.0.1.ebuild"
          sudo chroot "$GENTOO_ROOT" /bin/bash -lc \
            'export TMPDIR=/tmp FEATURES="-sandbox -userpriv"; ebuild /var/db/repos/d630-local/app-mobilephone/scrcpy/scrcpy-5.0.1.ebuild manifest'

          # All missing runtime atoms are compiled here into reusable binpkgs.
          # Dependencies may reuse existing Core 2 binpkgs; the remote generic binhost
          # is disabled. The later SFS job uses --usepkgonly and never compiles.
          # Refresh missing desktop/runtime packages and rebuild scrcpy from the
          # pinned D630 fork. The restored cache's old scrcpy 5.0.1 was upstream
          # and did not contain the required keyboard-to-gamepad -j extension.
          # Links already has three cached variants; the SFS USE config selects X.
          build_atoms='media-libs/libsdl3 sys-apps/dbus sys-apps/usbutils sys-auth/elogind sys-auth/pambase sys-boot/grub sys-fs/btrfs-progs sys-fs/dosfstools sys-libs/gpm net-misc/networkmanager net-wireless/iw net-wireless/wpa_supplicant net-wireless/wireless-regdb x11-apps/xmodmap x11-misc/xclip sys-apps/file sys-apps/less sys-apps/ripgrep media-video/pipewire x11-base/xorg-server =app-mobilephone/scrcpy-5.0.1::d630-local'
          reinstall_atoms="${build_atoms% =app-mobilephone/scrcpy-5.0.1::d630-local} app-mobilephone/scrcpy"
          sudo chroot "$GENTOO_ROOT" /bin/bash -lc \
            "export TMPDIR=/tmp FEATURES='-sandbox -userpriv'; emerge --ignore-default-opts --ask=n --verbose --jobs=2 --load-average=4 --with-bdeps=n --getbinpkg=n --usepkg --buildpkg --newuse --reinstall-atoms='$reinstall_atoms' --oneshot $build_atoms"

          dbus_binpkg="$(sudo find "$GENTOO_ROOT/var/cache/binpkgs/sys-apps/dbus" -maxdepth 1 -type f \
            \( -name 'dbus-*.gpkg.tar' -o -name 'dbus-*.tbz2' \) -print -quit 2>/dev/null)"
          [[ -n "$dbus_binpkg" ]] || {
            echo "The refresh did not produce a sys-apps/dbus binary package; refusing to publish an incomplete desktop binpkg set." >&2
            exit 1
          }
          echo "Verified D-Bus binpkg: $dbus_binpkg"

          pipewire_pkg="$(sudo find "$GENTOO_ROOT/var/db/pkg/media-video" -mindepth 1 -maxdepth 1 -type d -name 'pipewire-*' -print -quit)"
          [[ -n "$pipewire_pkg" && -s "$pipewire_pkg/USE" ]] || {
            echo "PipeWire package metadata is missing after the binpkg build." >&2
            exit 1
          }
          if grep -qw bluetooth "$pipewire_pkg/USE"; then
            echo "PipeWire still has Bluetooth enabled; refusing to publish this binpkg set." >&2
            exit 1
          fi

          xorg_pkg="$(sudo find "$GENTOO_ROOT/var/db/pkg/x11-base" -mindepth 1 -maxdepth 1 -type d -name 'xorg-server-*' -print -quit)"
          [[ -n "$xorg_pkg" && -s "$xorg_pkg/USE" ]] || {
            echo "Xorg package metadata is missing after the binpkg build." >&2
            exit 1
          }
          grep -qw elogind "$xorg_pkg/USE" || {
            echo "Xorg binpkg lacks elogind VT/session support." >&2
            exit 1
          }
          if grep -qw suid "$xorg_pkg/USE"; then
            echo "Xorg binpkg must remain rootless (USE=-suid)." >&2
            exit 1
          fi

          nm_pkg="$(sudo find "$GENTOO_ROOT/var/db/pkg/net-misc" -mindepth 1 -maxdepth 1 -type d -name 'networkmanager-*' -print -quit)"
          [[ -n "$nm_pkg" && -s "$nm_pkg/USE" ]] || {
            echo "NetworkManager package metadata is missing after the binpkg build." >&2
            exit 1
          }
          for flag in elogind tools wifi wext; do
            grep -qw "$flag" "$nm_pkg/USE" || {
              echo "NetworkManager binpkg is missing required USE=$flag." >&2
              exit 1
            }
          done
          grep -qw bluetooth "$nm_pkg/USE" && {
            echo "NetworkManager unexpectedly includes Bluetooth support." >&2
            exit 1
          }

          scrcpy_pkg="$(sudo find "$GENTOO_ROOT/var/db/pkg/app-mobilephone" -mindepth 1 -maxdepth 1 -type d -name 'scrcpy-5.0.1*' -print -quit)"
          if [[ -z "$scrcpy_pkg" || ! -s "$scrcpy_pkg/USE" ]]; then
            echo "The custom scrcpy 5.0.1 package was not installed." >&2
            exit 1
          fi
          if [[ ! -s "$scrcpy_pkg/repository" ]] || ! grep -qx 'd630-local' "$scrcpy_pkg/repository"; then
            echo "The installed scrcpy package did not come from the pinned d630-local ebuild." >&2
            exit 1
          fi
          if ! grep -qw X "$scrcpy_pkg/USE" || grep -qw wayland "$scrcpy_pkg/USE"; then
            echo "The D630 scrcpy package must be X-enabled and Wayland-free." >&2
            exit 1
          fi
          scrcpy_help="$(sudo chroot "$GENTOO_ROOT" /usr/bin/scrcpy --help 2>&1 || true)"
          if ! grep -Eq -- '(^|[[:space:]])-j([,[:space:]]|$)|--keyboard-gamepad' <<< "$scrcpy_help"; then
            echo "The rebuilt scrcpy binary does not expose the D630 keyboard-gamepad -j option." >&2
            exit 1
          fi
          scrcpy_binpkg="$(sudo find "$GENTOO_ROOT/var/cache/binpkgs/app-mobilephone/scrcpy" -maxdepth 1 -type f \
            -name 'scrcpy-5.0.1-*.gpkg.tar' -print -quit 2>/dev/null)"
          if [[ -z "$scrcpy_binpkg" ]]; then
            echo "The custom scrcpy 5.0.1 binary package was not written to PKGDIR." >&2
            exit 1
          fi
          echo "Verified D630 scrcpy 5.0.1 (-j) from d630-local: $scrcpy_binpkg"
          links_binpkg_dir="$GENTOO_ROOT/var/cache/binpkgs/www-client/links"
          mapfile -t links_binpkgs < <(sudo find "$links_binpkg_dir" -maxdepth 1 -type f \
            -name 'links-2.30-r3-*.gpkg.tar' -print | sort)
          if (( ${#links_binpkgs[@]} < 3 )); then
            echo "Expected all three Links binpkg builds in the restored PKGDIR; found ${#links_binpkgs[@]}." >&2
            exit 1
          fi
          printf 'Verified Links binpkg builds:\n%s\n' "${links_binpkgs[@]}"
          echo "Verified Core 2 runtime inputs: scrcpy 5.0.1 (-j), three Links binpkg builds (X variant selected by the SFS USE config), PipeWire (-bluetooth), rootless Xorg (elogind), and NetworkManager (Wi-Fi/WEXT/tools)."
          echo "Additional missing D630 runtime dependencies were built into the same PKGDIR as binary packages."

      - name: Package current PKGDIR and publish the updated binpkg release
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          pkgdir="$GENTOO_ROOT/var/cache/binpkgs"
          release_dir="$RUNNER_TEMP/binpkgs-release"
          mkdir -p "$release_dir"
          [[ -d "$pkgdir" ]] || {
            echo "Restored Gentoo state has no PKGDIR at $pkgdir." >&2
            exit 1
          }
          count="$(find "$pkgdir" -type f \( -name '*.gpkg.tar' -o -name '*.tbz2' \) | wc -l)"
          (( count > 0 )) || {
            echo "No Gentoo binary packages were present in the restored PKGDIR." >&2
            exit 1
          }
          echo "Restored PKGDIR contains $count binary package files."
          find "$pkgdir" -type f \( -name '*.gpkg.tar' -o -name '*.tbz2' \) \
            -printf '%T@ %TY-%Tm-%Td %TH:%TM %p\n' | sort -nr | sed -n '1,30p' \
            | tee "$RUNNER_TEMP/latest-binpkgs.txt"

          bash scripts/package-binpkgs-release.sh "$pkgdir" "$release_dir" 1500000000
          {
            echo "Target: amd64 / glibc / OpenRC Gentoo Stage 3"
            echo "CPU target: Intel Core 2 / Merom"
            echo "CFLAGS: -O2 -pipe -march=core2 -mtune=core2"
            echo "Source saved-state tag: $STATE_TAG"
            echo "Source commit: $GITHUB_SHA"
            echo "Publisher run ID: $GITHUB_RUN_ID"
            echo "Binary package files in restored PKGDIR: $count"
            echo "Same-run artifact: refreshed-core2-binpkgs-$GITHUB_RUN_ID"
            echo "This artifact exports the complete current saved runner PKGDIR for the dependent SFS job."
            echo
            echo "Most recently modified package files:"
            cat "$RUNNER_TEMP/latest-binpkgs.txt"
          } > "$release_dir/BUILD-MANIFEST.txt"
          (
            cd "$release_dir"
            sha256sum PACKAGE-LIST.txt BUILD-MANIFEST.txt binpkgs-part-*.tar.zst > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "binpkg_run_ids=" >> "$GITHUB_OUTPUT"
          echo "Prepared the complete Core 2 PKGDIR for same-run artifact transfer to the Openbox SFS job." |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload refreshed Core 2 binpkgs for the Openbox build
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-core2-binpkgs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/binpkgs-release/PACKAGE-LIST.txt
            ${{ runner.temp }}/binpkgs-release/BUILD-MANIFEST.txt
            ${{ runner.temp }}/binpkgs-release/SHA256SUMS
            ${{ runner.temp }}/binpkgs-release/binpkgs-part-*.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload binpkg refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binpkg-refresh-report-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gentoo-state/manifest.txt
            ${{ runner.temp }}/gentoo-state/selected-state.txt
            ${{ runner.temp }}/gentoo-state/host-disk-before-restore.txt
            ${{ runner.temp }}/gentoo-state/host-disk-after-restore.txt
            ${{ runner.temp }}/gentoo-state/extract.log
            ${{ runner.temp }}/latest-binpkgs.txt
            ${{ runner.temp }}/binpkgs-release/BUILD-MANIFEST.txt
            ${{ runner.temp }}/binpkgs-release/PACKAGE-LIST.txt
            ${{ runner.temp }}/binpkgs-release/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  build-openbox:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_openbox) || (github.event_name == 'workflow_call' && inputs.build_openbox) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'run binpkg refresh and build Openbox SFS')) }}
    name: Build and verify Openbox SFS from refreshed packages
    needs: publish-binpkgs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUNTIME_PROFILE: openbox
      BINPKG_RUN_IDS: ""
      SOURCE_FALLBACK: "false"
      KERNEL_BUNDLE_TAG: ${{ inputs.kernel_bundle_tag || 'd630-kernel-6.18.56-run-41317026490' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out D630 Gentoo configuration
        uses: actions/checkout@v4

      - name: Download the freshly built Core 2 binpkgs
        uses: actions/download-artifact@v4
        with:
          name: refreshed-core2-binpkgs-${{ github.run_id }}
          path: ${{ runner.temp }}/refreshed-core2-binpkgs

      - name: Install host tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 tar xz-utils zstd rsync squashfs-tools \
            e2fsprogs util-linux gzip
          sudo apt-get clean
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build runtime root and trimmed SquashFS
        shell: bash
        env:
          LOCAL_RELEASE_ASSETS_DIR: ${{ runner.temp }}/refreshed-core2-binpkgs
        run: |
          set -Eeuo pipefail
          sudo --preserve-env=RUNTIME_PROFILE,BINPKG_RUN_IDS,LOCAL_RELEASE_ASSETS_DIR,SOURCE_FALLBACK,KERNEL_BUNDLE_TAG,GH_TOKEN,RUNNER_TEMP,GITHUB_WORKSPACE,GITHUB_REPOSITORY,GITHUB_STEP_SUMMARY \
            bash d630-gentoo/scripts/build-runtime-squashfs.sh

      - name: Test the resulting SquashFS contents
        shell: bash
        run: |
          set -Eeuo pipefail
          sfs="$GITHUB_WORKSPACE/output/squashfs"
          [[ -s "$sfs" ]] || { echo "Expected SquashFS not found: $sfs" >&2; exit 1; }
          listing="$RUNNER_TEMP/squashfs-list.txt"
          unsquashfs -ll "$sfs" > "$listing"
          fail=0
          for path in usr/share/man usr/share/info usr/share/doc usr/share/gtk-doc usr/share/help usr/share/gnome/help usr/share/i18n var/cache/man; do
            if grep -Eq "squashfs-root/$path(/|$)" "$listing"; then
              echo "FAIL: /$path is still present"; fail=1
            else
              echo "PASS: /$path removed"
            fi
          done
          for path in usr/bin/nvim usr/bin/lf usr/bin/fd usr/bin/tldr usr/bin/htop usr/bin/btop usr/bin/mc usr/bin/rg usr/bin/zsh usr/bin/nano usr/bin/tmux usr/bin/startx usr/bin/xterm usr/bin/openbox-session; do
            if grep -Eq "squashfs-root/$path([[:space:]]|$)" "$listing"; then
              echo "PASS: /$path present"
            else
              echo "FAIL: /$path missing"; fail=1
            fi
          done
          if grep -Eq 'squashfs-root/usr/share/licenses(/|$)' "$listing"; then
            echo "PASS: licenses preserved"
          else
            echo "FAIL: license files missing"; fail=1
          fi
          exit "$fail"

      - name: Upload verified SFS and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d630-openbox-squashfs-refreshed-run-${{ github.run_number }}
          path: |
            output/squashfs
            output/kernel
            output/initramfs
            output/KERNELRELEASE.txt
            output/KERNEL-BUILD-MANIFEST.txt
            output/SOURCE-BUILD-MANIFEST.txt
            output/LOCAL-BINPKG-IMPORT.txt
            output/mesa-binpkg.log
            output/PREPARED-ASSET-CHECK.log
            output/SHA256SUMS
            output/SQUASHFS-SHA256.txt
            output/GLXGEARS-STATUS.txt
            output/mesa-progs-binpkg.log
            output/RUNTIME-MANIFEST.txt
            output/RELEASE-NOTES.md
            output/PACKAGES.txt
            output/INSTALLED-PACKAGES.txt
            output/EMERGE-INFO.txt
            output/BUILD-INPUTS.txt
            output/STAGE3-MANIFEST.txt
            output/PORTAGE-TARGET.txt
            output/SQUASHFS-INFO.txt
            output/INIT-PROBE.txt
            output/KERNEL-MODULES.txt
            output/portage-bootstrap.log
            output/emerge-runtime.log
            output/depclean.log
            output/locale.log
            ${{ runner.temp }}/squashfs-list.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
