name: Validate d630-gentoo sources

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source scaffold
        run: |
          chmod +x scripts/validate-sources.sh
          ./scripts/validate-sources.sh

      - name: Lint GitHub Actions workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  build-openbox:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, 'trigger improved Openbox runtime SFS')) || (github.event_name == 'pull_request' && github.head_ref == 'openbox-python-runtime-prune') }}
    needs: validate
    name: Build improved Openbox runtime SFS
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUNTIME_PROFILE: openbox
      BINPKG_RUN_IDS: "39507549274"
      LOCAL_RELEASE_ASSETS_DIR: ""
      SOURCE_FALLBACK: "true"
      KERNEL_BUNDLE_TAG: d630-kernel-6.18.56-run-40922514538
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 tar xz-utils zstd rsync squashfs-tools \
            e2fsprogs util-linux gzip
          sudo apt-get clean
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build runtime root and trimmed SquashFS
        run: |
          set -Eeuo pipefail
          sudo --preserve-env=RUNTIME_PROFILE,BINPKG_RUN_IDS,LOCAL_RELEASE_ASSETS_DIR,SOURCE_FALLBACK,KERNEL_BUNDLE_TAG,GH_TOKEN,RUNNER_TEMP,GITHUB_WORKSPACE,GITHUB_REPOSITORY,GITHUB_STEP_SUMMARY \
            bash d630-gentoo/scripts/build-runtime-squashfs.sh
      - name: Upload SFS and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d630-openbox-runtime-run-${{ github.run_number }}
          path: |
            output/squashfs
            output/SQUASHFS-SHA256.txt
            output/SHA256SUMS
            output/RUNTIME-MANIFEST.txt
            output/PACKAGES.txt
            output/INSTALLED-PACKAGES.txt
            output/EMERGE-INFO.txt
            output/BUILD-INPUTS.txt
            output/STAGE3-MANIFEST.txt
            output/KERNEL-MODULES.txt
            output/SQUASHFS-INFO.txt
            output/INIT-PROBE.txt
            output/portage-bootstrap.log
            output/emerge-runtime.log
            output/depclean.log
            output/locale.log
            output/mesa-binpkg.log
            output/PREPARED-ASSET-CHECK.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Report image size and checksums
        if: success()
        run: |
          set -Eeuo pipefail
          test -s output/squashfs
          du -h output/squashfs
          sha256sum output/squashfs
          {
            echo "### Improved D630 Openbox runtime SFS built"
            echo
            echo "Artifact: d630-openbox-runtime-run-${{ github.run_number }}"
            echo "Profile: openbox + CLI tools + pinned deb12dots skeleton configuration"
            echo "The build applies manual/locale/development-payload trimming and checks the actual final SquashFS."
            echo
            echo "QEMU graphical startup and physical D630 hardware still require runtime testing."
          } >> "$GITHUB_STEP_SUMMARY"
