# D630 GUI initramfs: Gentoo OpenRC, Xorg, Crocus Mesa, and Openbox.
# Copy kernel and gui-initram to /d630-gui/ on a GRUB-readable partition.

menuentry 'D630 GUI Linux (Gentoo Mini)' {
    if search --no-floppy --file --set=gui_kernel_root /d630-gui/kernel; then
        if search --no-floppy --file --set=gui_initrd_root /d630-gui/gui-initram; then
            linux (${gui_kernel_root})/d630-gui/kernel quiet loglevel=4
            initrd (${gui_initrd_root})/d630-gui/gui-initram
        else
            echo 'D630 GUI: cannot find /d630-gui/gui-initram.'
            sleep 5
        fi
    else
        echo 'D630 GUI: cannot find /d630-gui/kernel.'
        sleep 5
    fi
}
