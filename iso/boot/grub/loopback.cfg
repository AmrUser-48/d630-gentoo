# This file is installed inside the ISO at /boot/grub/loopback.cfg.
# Super Grub2 Disk exports iso_path when loading an ISO through loopback.
#
# The build pipeline must place these files inside the ISO:
#   /boot/vmlinuz-d630-gentoo  (kernel with CONFIG_INITRAMFS_SOURCE embedded)
#   /LiveOS/rootfs.squashfs    (read-only base system)
#
# The embedded /init must implement the d630.* parameters below:
#   d630.iso_uuid       filesystem UUID containing the ISO file
#   d630.iso_path       ISO path on that filesystem, without spaces
#   d630.persistence    auto (persistent) or volatile (RAM-only)
#   d630.datafile       ext4 filesystem image relative to the ISO directory
#   d630.rootfs         SquashFS root path inside the ISO
#   d630.debug=1        verbose early-boot diagnostics
#
# Persistent mode requires gentoo-data.img beside the ISO on a writable
# host filesystem. The ext4 image supplies OverlayFS upperdir/workdir.
# No standalone initrd is loaded: early userspace is embedded in the kernel.

set timeout=5
set default=d630-persistent

if [ -z "${iso_path}" ]; then
    menuentry "D630 Gentoo: Super Grub2 Disk did not set iso_path" {
        echo "Boot this ISO through Super Grub2 Disk's loopback support."
        echo "Expected exported variable: iso_path"
        sleep 10
    }
else
    if search --no-floppy --set=d630_iso_dev --file "${iso_path}"; then
        probe --set=d630_iso_uuid --fs-uuid "${d630_iso_dev}"

        menuentry "D630 Gentoo - persistent desktop (gentoo-data.img required)" --id d630-persistent {
            set gfxpayload=keep
            linux /boot/vmlinuz-d630-gentoo d630.iso_uuid=${d630_iso_uuid} d630.iso_path=${iso_path} d630.persistence=auto d630.datafile=gentoo-data.img d630.rootfs=/LiveOS/rootfs.squashfs quiet loglevel=3
        }

        menuentry "D630 Gentoo - temporary session (changes lost on reboot)" --id d630-volatile {
            set gfxpayload=keep
            linux /boot/vmlinuz-d630-gentoo d630.iso_uuid=${d630_iso_uuid} d630.iso_path=${iso_path} d630.persistence=volatile d630.datafile=gentoo-data.img d630.rootfs=/LiveOS/rootfs.squashfs quiet loglevel=3
        }

        menuentry "D630 Gentoo - persistent desktop (verbose boot)" --id d630-debug {
            set gfxpayload=keep
            linux /boot/vmlinuz-d630-gentoo d630.iso_uuid=${d630_iso_uuid} d630.iso_path=${iso_path} d630.persistence=auto d630.datafile=gentoo-data.img d630.rootfs=/LiveOS/rootfs.squashfs d630.debug=1 loglevel=7 ignore_loglevel
        }
    else
        menuentry "D630 Gentoo: ISO backing filesystem not found" {
            echo "Could not locate ${iso_path} on a GRUB-visible filesystem."
            sleep 10
        }
    fi
fi
