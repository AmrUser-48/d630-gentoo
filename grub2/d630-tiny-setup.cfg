# Gentoo Mini setup environment for D630 Tiny Linux.
# Copy kernel and initramfs-setup into /d630-tiny/ on a GRUB-readable
# partition, then add this file to /etc/grub.d/40_custom.

menuentry 'D630 Tiny Linux (Gentoo Mini setup)' {
    if search --no-floppy --file --set=tiny_kernel_root /d630-tiny/kernel; then
        if search --no-floppy --file --set=tiny_initrd_root /d630-tiny/initramfs-setup; then
            linux (${tiny_kernel_root})/d630-tiny/kernel quiet loglevel=4
            initrd (${tiny_initrd_root})/d630-tiny/initramfs-setup
        else
            echo 'D630 Tiny: cannot find /d630-tiny/initramfs-setup.'
            sleep 5
        fi
    else
        echo 'D630 Tiny: cannot find /d630-tiny/kernel.'
        sleep 5
    fi
}
