# Standalone D630 Tiny Linux with Wi-Fi and download tools.
# Copy kernel and initramfs-internet into /d630-tiny/ on a GRUB-readable
# partition, then add this file to /etc/grub.d/40_custom.

menuentry 'D630 Tiny Linux (internet-enabled shell)' {
    if search --no-floppy --file --set=tiny_kernel_root /d630-tiny/kernel; then
        if search --no-floppy --file --set=tiny_initrd_root /d630-tiny/initramfs-internet; then
            linux (${tiny_kernel_root})/d630-tiny/kernel quiet loglevel=4
            initrd (${tiny_initrd_root})/d630-tiny/initramfs-internet
        else
            echo 'D630 Tiny: cannot find /d630-tiny/initramfs-internet.'
            sleep 5
        fi
    else
        echo 'D630 Tiny: cannot find /d630-tiny/kernel.'
        sleep 5
    fi
}
