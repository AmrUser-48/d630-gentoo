# D630 Tiny Linux: single setup + internet initramfs.
# Copy the release assets kernel and initramfs to /d630-tiny/ on a GRUB-readable
# partition, then add this file to /etc/grub.d/40_custom.

menuentry 'D630 Tiny Linux (Gentoo Mini)' {
    if search --no-floppy --file --set=tiny_kernel_root /d630-tiny/kernel; then
        if search --no-floppy --file --set=tiny_initrd_root /d630-tiny/initramfs; then
            linux (${tiny_kernel_root})/d630-tiny/kernel quiet loglevel=4
            initrd (${tiny_initrd_root})/d630-tiny/initramfs
        else
            echo 'D630 Tiny: cannot find /d630-tiny/initramfs.'
            sleep 5
        fi
    else
        echo 'D630 Tiny: cannot find /d630-tiny/kernel.'
        sleep 5
    fi
}
