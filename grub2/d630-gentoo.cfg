# D630 Gentoo three-file boot entry.
# Add to /etc/grub.d/40_custom, then regenerate GRUB's configuration.
#
# Put these three files on the same partition:
#   /d630-gentoo/kernel
#   /d630-gentoo/initramfs
#   /d630-gentoo/squashfs
#
# The filesystem UUID is passed to initramfs so it checks the same partition
# from which GRUB loaded the kernel. Initramfs also supports scanning all
# supported partitions if d630.boot_uuid is omitted.

menuentry 'D630 Gentoo (three-file, auto-detect)' {
    search --no-floppy --file --set=root /d630-gentoo/kernel
    probe --set=d630_boot_uuid --fs-uuid $root
    linux /d630-gentoo/kernel d630.boot_uuid=$d630_boot_uuid quiet
    initrd /d630-gentoo/initramfs
}
