# D630 Gentoo three-file boot entry.
# Add to /etc/grub.d/40_custom, then regenerate GRUB's configuration.
#
# The kernel and initramfs may be found on any GRUB-readable partition.
# The SquashFS root may be on a different supported partition. Initramfs
# searches supported partitions for /d630-gentoo/squashfs because this entry
# deliberately does NOT pass d630.boot_uuid.
#
# Expected paths (kernel/initramfs need not share a partition with squashfs):
#   /d630-gentoo/kernel
#   /d630-gentoo/initramfs
#   /d630-gentoo/squashfs

menuentry 'D630 Gentoo (find root filesystem automatically)' {
    if search --no-floppy --file --set=gentoo_kernel_root /d630-gentoo/kernel; then
        if search --no-floppy --file --set=gentoo_initrd_root /d630-gentoo/initramfs; then
            linux (${gentoo_kernel_root})/d630-gentoo/kernel d630.squashfs=/d630-gentoo/squashfs quiet
            initrd (${gentoo_initrd_root})/d630-gentoo/initramfs
        else
            echo 'D630 Gentoo: cannot find /d630-gentoo/initramfs on any GRUB-readable partition.'
            sleep 5
        fi
    else
        echo 'D630 Gentoo: cannot find /d630-gentoo/kernel on any GRUB-readable partition.'
        sleep 5
    fi
}
