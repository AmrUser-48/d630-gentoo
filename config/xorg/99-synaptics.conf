# Prefer the classic Synaptics driver for the D630 touchpad.
# This file is loaded after the usual 40-libinput.conf and selects Synaptics for touchpads.
Section "InputClass"
    Identifier "D630 Synaptics touchpad"
    MatchIsTouchpad "on"
    Driver "synaptics"
    Option "VertEdgeScroll" "on"
    Option "HorizEdgeScroll" "on"
    Option "TapButton1" "1"
    Option "TapButton2" "3"
    Option "TapButton3" "2"
    Option "PalmDetect" "on"
EndSection
