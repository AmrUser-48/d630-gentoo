# Template for the build environment. Review against the chosen Gentoo
# profile before use; this file is not a complete profile configuration.
COMMON_FLAGS="-O2 -pipe -march=core2 -mtune=core2"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# GitHub Actions runners have more CPUs than the D630. Adjust based on
# runner memory and avoid exhausting RAM during parallel compilation.
MAKEOPTS="-j4"
FEATURES="parallel-fetch"

# Conservative starting point; individual packages may need additional
# USE flags. Do not globally enable LTO for the first working image.
USE="-systemd -wayland X alsa dbus udev"
