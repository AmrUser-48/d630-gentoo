# Canonical Portage configuration for building packages that must run
# on the Dell Latitude D630 (Intel Core 2 Duo T7250 / Merom).
# NEVER use -march=native in CI: it would target the GitHub runner CPU.

COMMON_FLAGS="-O2 -march=core2 -mtune=core2"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"

# Rust packages must target the D630 CPU, not the CI runner.
RUSTFLAGS="-C target-cpu=core2"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# GitHub-hosted x86_64 runners commonly expose four build CPUs.
MAKEOPTS="-j4"
NINJAOPTS="-j4"
EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=4 --with-bdeps=n --usepkg"

# Keep reusable Gentoo binary packages and reduce their published size.
# Strip before packaging, compress controllable docs, and do not retain split debug files.
FEATURES="parallel-fetch buildpkg getbinpkg binpkg-multi-instance binpkg-dostrip binpkg-docompress -splitdebug"
PKGDIR="/var/cache/binpkgs"
# Zstandard level 9 trades extra package-build CPU time for smaller binpkgs.
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-9"
PORT_LOGDIR="/var/log/portage"

# OpenRC + X11 desktop. Avoid forcing systemd, Wayland or global LTO.
# Per-package flags for Core 2 and D630 hardware live in package.use/.
USE="X alsa dbus elogind man udev -systemd -wayland"
