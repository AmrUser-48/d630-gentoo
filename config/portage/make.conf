# Canonical Portage configuration for building packages that must run
# on the Dell Latitude D630 (Intel Core 2 Duo T7250 / Merom).
# NEVER use -march=native in CI: it would target the GitHub runner CPU.
# Stable Gentoo branch only; do not accept ~amd64 testing ebuilds.
ACCEPT_KEYWORDS="amd64"

COMMON_FLAGS="-O2 -pipe -march=core2 -mtune=core2"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Rust packages must target Core 2 too; never use the newer CI host CPU.
RUSTFLAGS="-C target-cpu=core2"

# GitHub-hosted x86_64 runners commonly expose four build CPUs.
MAKEOPTS="-j4"
# Interactive emerge shows package/USE details and asks before applying changes.
# Automated commands must explicitly disable prompting when running without a TTY.
EMERGE_DEFAULT_OPTS="--ask --verbose --jobs=1 --load-average=4 --with-bdeps=y"

# Keep Portage binary packages: buildpkg emits reusable Gentoo binpkgs.
FEATURES="parallel-fetch buildpkg"
PKGDIR="/var/cache/binpkgs"
PORT_LOGDIR="/var/log/portage"

# OpenRC + X11 desktop. Avoid forcing systemd, Wayland or global LTO.
# Per-package flags for Core 2 and D630 hardware live in package.use/.
USE="X alsa dbus udev -systemd -wayland"
