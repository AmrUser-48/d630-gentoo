# Gentoo Portage baseline for the Dell Latitude D630 target.
# These compiler flags target Merom/Core 2, NOT the GitHub Actions host CPU.
# The workflow uses an amd64 glibc/OpenRC Stage 3 as a build chroot.

COMMON_FLAGS="-O2 -pipe -march=core2 -mtune=core2"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# The standard GitHub-hosted Ubuntu runner offers a few CPU cores.
# Keep total compile parallelism moderate; the D630 itself has only 2 cores.
MAKEOPTS="-j4"
EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=4 --keep-going=y"

# Make binary packages for builds launched from the web runner.
# They can be downloaded at the end of the session as a workflow artifact.
FEATURES="parallel-fetch buildpkg"
PKGDIR="/var/cache/binpkgs"

# X11/OpenRC daily-use system. Configure specialized hardware/CPU flags per
# package in package.use; avoid globally enabling every optional subsystem.
USE="X alsa dbus udev -systemd -wayland -test"
L10N="en-US"

# GRUB output should include the legacy PC BIOS target for the D630.
GRUB_PLATFORMS="pc"
